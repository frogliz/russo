<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>1000-7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=Rubik+Glitch&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ================================================================
   TOKENS
   ================================================================ */
:root{
  --preto:#050608;
  --carvao:#0b0d12;
  --aco:#12151d;
  --fenda:#1b1f2a;
  --osso:#e9e6df;
  --cinza:#8b8f9c;
  --sangue:#e51837;
  --sangue-escuro:#7a0b1d;
  --brasa:#ff4d5e;
  --online:#23a55a; --idle:#f0b232; --dnd:#f23f43; --off:#80848e;
  --ui:'Chakra Petch',sans-serif;
  --glitch:'Rubik Glitch',cursive;
  --jp:'Shippori Mincho',serif;
}
/* MODO REI — triplo clique no avatar (tema do rei de um olho só) */
body.rei{
  --preto:#dcd9d0; --carvao:#e7e4db; --aco:#f0ede5; --fenda:#c3bfb2;
  --osso:#15161a; --cinza:#565a66;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--preto);
  color:var(--osso);
  font-family:var(--ui);
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background .8s ease;
}
::selection{background:var(--sangue);color:#fff}
::-webkit-scrollbar{width:9px}
::-webkit-scrollbar-track{background:var(--carvao)}
::-webkit-scrollbar-thumb{background:var(--sangue-escuro);border:2px solid var(--carvao)}
::-webkit-scrollbar-thumb:hover{background:var(--sangue)}

/* ================================================================
   FUNDO
   ================================================================ */
#celulas{position:fixed;inset:0;z-index:0;pointer-events:none}
.vinheta{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(0,0,0,.75) 100%);
  transition:background 1s ease}
body.rei .vinheta{background:radial-gradient(ellipse at 50% 45%, transparent 45%, rgba(120,116,104,.5) 100%)}
.veias{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:.05;mix-blend-mode:screen;
  background-image:radial-gradient(circle at 15% 85%, var(--sangue) 0, transparent 22%),
                   radial-gradient(circle at 88% 12%, var(--sangue) 0, transparent 18%);
  transition:opacity .25s ease}
body.batida .veias{opacity:.16}
.scan{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;
  background:repeating-linear-gradient(0deg, transparent 0 2px, #000 2px 3px);}

/* veias gigantes cruzando a tela */
#veios{position:fixed;inset:0;z-index:0;pointer-events:none;
  filter:blur(1.5px);animation:veios-respira 13s ease-in-out infinite}
#veios path{fill:none;stroke:var(--sangue);stroke-linecap:round}
@keyframes veios-respira{
  0%,100%{opacity:.5;transform:translate(0,0) scale(1)}
  50%{opacity:.85;transform:translate(-12px,8px) scale(1.02)}
}
body.batida #veios{opacity:1}

.kanji-fantasma{
  position:fixed;z-index:0;pointer-events:none;
  font-family:var(--jp);font-weight:800;color:transparent;
  -webkit-text-stroke:1px rgba(229,24,55,.10);
  user-select:none;will-change:transform;
  animation:respira 9s ease-in-out infinite;
}
.kanji-fantasma.k1{font-size:min(52vh,52vw);top:50%;left:50%;margin-top:calc(min(52vh,52vw)/-2);margin-left:calc(min(52vh,52vw)/-2)}
.kanji-fantasma.k2{font-size:12vh;top:8%;left:6%;animation-delay:-4s;-webkit-text-stroke-color:rgba(233,230,223,.05)}
.kanji-fantasma.k3{font-size:10vh;bottom:7%;right:7%;animation-delay:-2s;-webkit-text-stroke-color:rgba(233,230,223,.05)}
body.rei .kanji-fantasma.k2,body.rei .kanji-fantasma.k3{-webkit-text-stroke-color:rgba(21,22,26,.10)}
@keyframes respira{0%,100%{opacity:.5;filter:blur(0)}50%{opacity:1;filter:blur(1px)}}

/* cantos HUD */
.hud{position:fixed;width:26px;height:26px;z-index:3;pointer-events:none;opacity:.5;
  animation:hud-pulsa 4s ease-in-out infinite}
.hud.tl{top:14px;left:14px;border-top:1px solid var(--sangue);border-left:1px solid var(--sangue)}
.hud.tr{top:14px;right:14px;border-top:1px solid var(--sangue);border-right:1px solid var(--sangue)}
.hud.bl{bottom:14px;left:14px;border-bottom:1px solid var(--sangue);border-left:1px solid var(--sangue)}
.hud.br{bottom:14px;right:14px;border-bottom:1px solid var(--sangue);border-right:1px solid var(--sangue)}
@keyframes hud-pulsa{0%,100%{opacity:.28}50%{opacity:.75}}

/* ================================================================
   BOTÃO DE SOM
   ================================================================ */
#btnSom{
  position:fixed;top:18px;right:18px;z-index:60;
  background:rgba(11,13,18,.7);border:1px solid var(--fenda);color:var(--cinza);
  font-family:var(--ui);font-size:10px;letter-spacing:.3em;text-transform:uppercase;
  padding:9px 14px 9px 16px;cursor:pointer;backdrop-filter:blur(4px);
  clip-path:polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  transition:.25s ease;
}
body.rei #btnSom{background:rgba(240,237,229,.7)}
#btnSom:hover{color:var(--osso);border-color:rgba(229,24,55,.5)}
#btnSom.ligado{color:var(--brasa)}

/* ================================================================
   ENTRADA — O OLHO v2
   ================================================================ */
#entrada{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:42px;
  transition:opacity .45s ease;
}
#entrada.saindo{opacity:0;pointer-events:none}

/* névoa vermelha ambiente */
.nevoa{position:absolute;width:60vmax;height:60vmax;border-radius:50%;
  background:radial-gradient(closest-side, rgba(229,24,55,.07), transparent 70%);
  filter:blur(30px);pointer-events:none}
.nevoa.n1{top:-20vmax;left:-15vmax;animation:nevoa-vaga 26s ease-in-out infinite}
.nevoa.n2{bottom:-25vmax;right:-12vmax;animation:nevoa-vaga 32s ease-in-out infinite reverse}
@keyframes nevoa-vaga{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(8vmax,4vmax) scale(1.15)}}

.olho-wrap{position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;
  animation:chega-olho 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes chega-olho{from{opacity:0;transform:scale(.7);filter:blur(8px)}to{opacity:1;transform:scale(1);filter:blur(0)}}
.olho-wrap:focus-visible{outline:2px solid var(--sangue);outline-offset:18px;border-radius:50%}

/* kanjis sussurrando ao redor (aparecem no hover) */
.sussurro{position:absolute;font-family:var(--jp);font-size:15px;color:rgba(229,24,55,.0);
  pointer-events:none;letter-spacing:.2em;transition:color .6s ease;white-space:nowrap;
  animation:sussurro-flutua 4s ease-in-out infinite}
.olho-wrap:hover .sussurro{color:rgba(229,24,55,.55)}
.sussurro.s1{top:-16%;left:-34%;animation-delay:0s}
.sussurro.s2{top:6%;right:-40%;animation-delay:-1.2s}
.sussurro.s3{bottom:-8%;left:-28%;animation-delay:-2.1s}
.sussurro.s4{bottom:14%;right:-32%;animation-delay:-3s}
@keyframes sussurro-flutua{0%,100%{transform:translateY(0);filter:blur(0)}50%{transform:translateY(-8px);filter:blur(.6px)}}

.anel{position:absolute;inset:0;border-radius:50%;pointer-events:none;transition:animation-duration .4s}
.anel.a1{--s:1.28;border:1px solid rgba(229,24,55,.28);transform:scale(1.28);animation:gira 14s linear infinite}
.anel.a2{--s:1.55;border:1px dashed rgba(233,230,223,.12);transform:scale(1.55);animation:gira 26s linear infinite reverse}
.anel.a1::before,.anel.a2::before{
  content:"";position:absolute;width:5px;height:5px;border-radius:50%;
  background:var(--sangue);top:-3px;left:calc(50% - 2.5px);
  box-shadow:0 0 12px var(--sangue);
}
@keyframes gira{to{transform:scale(var(--s,1)) rotate(360deg)}}
.olho-wrap.despertando .anel.a1{animation-duration:1.1s}
.olho-wrap.despertando .anel.a2{animation-duration:2s}

.olho{
  width:min(210px,46vw);height:min(210px,46vw);display:block;
  filter:drop-shadow(0 0 34px rgba(229,24,55,.4)) drop-shadow(0 0 90px rgba(229,24,55,.22));
  animation:pulsa-olho 3.4s ease-in-out infinite;
}
@keyframes pulsa-olho{
  0%,100%{filter:drop-shadow(0 0 26px rgba(229,24,55,.32)) drop-shadow(0 0 70px rgba(229,24,55,.16))}
  50%{filter:drop-shadow(0 0 44px rgba(229,24,55,.55)) drop-shadow(0 0 110px rgba(229,24,55,.3))}
}
.olho-wrap.despertando .olho{
  animation:none;
  filter:drop-shadow(0 0 70px rgba(229,24,55,.95)) drop-shadow(0 0 140px rgba(229,24,55,.5));
}
.palpebra{transform-box:fill-box;transform-origin:center;animation:piscar 6.5s ease-in-out infinite}
@keyframes piscar{
  0%,93%,100%{transform:scaleY(0)}
  95.5%{transform:scaleY(1)}
  98%{transform:scaleY(0)}
}
.olho-wrap.despertando .palpebra{animation:none;transform:scaleY(0)}
.iris-grupo{animation:deriva 8s ease-in-out infinite}
@keyframes deriva{
  0%,100%{transform:translate(0,0)}
  22%{transform:translate(5px,-2px)}
  48%{transform:translate(-4px,3px)}
  74%{transform:translate(2px,4px)}
}
.pupila{animation:dilata 3.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes dilata{0%,100%{transform:scale(1)}50%{transform:scale(.82)}}
/* clique: pupila vira fenda, congela, e estoura */
.olho-wrap.despertando .pupila{animation:pupila-desperta .85s cubic-bezier(.7,0,.25,1) forwards}
@keyframes pupila-desperta{
  0%{transform:scale(1)}
  30%{transform:scale(1.05,.1)}
  55%{transform:scale(1.05,.1)}
  78%{transform:scale(2)}
  100%{transform:scale(1.55)}
}
.veias-olho{opacity:.45;transition:opacity .3s ease}
.olho-wrap:hover .veias-olho{opacity:.75}
.olho-wrap.despertando .veias-olho{opacity:1;stroke-width:1.6}
/* lágrima de sangue */
.gota{transform-box:fill-box;transform-origin:center;animation:gota-cai 7s ease-in infinite}
@keyframes gota-cai{
  0%,55%{opacity:0;transform:translateY(0) scale(.4)}
  60%{opacity:.9;transform:translateY(2px) scale(.7)}
  68%{opacity:1;transform:translateY(6px) scale(1)}
  88%{opacity:1;transform:translateY(30px) scale(1,1.25)}
  100%{opacity:0;transform:translateY(38px) scale(.9)}
}
.trilha-gota{transform-box:fill-box;transform-origin:top;animation:trilha-cresce 7s ease-in infinite;opacity:.5}
@keyframes trilha-cresce{0%,55%{transform:scaleY(0)}88%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}

.olho-wrap::before{content:"";position:absolute;inset:-28%;border-radius:50%;pointer-events:none;
  background:radial-gradient(circle, rgba(229,24,55,.3), transparent 62%);
  opacity:0;transition:opacity .45s ease;filter:blur(16px);z-index:-1}
.olho-wrap:hover::before{opacity:1}
.pupila{transition:scale .55s cubic-bezier(.2,.8,.2,1)}
.olho-wrap:hover .pupila{scale:.72}
.olho-wrap:active .olho{transform:scale(.97)}

.rotulo-entrada{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;
  animation:chega-rotulo 1.4s .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes chega-rotulo{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rotulo-entrada .jp{font-family:var(--jp);color:var(--sangue);letter-spacing:.9em;padding-left:.9em;font-size:13px;opacity:.85}
.rotulo-entrada .principal{
  font-family:var(--glitch);font-size:clamp(24px,5vw,38px);letter-spacing:.28em;padding-left:.28em;
  color:var(--osso);
  animation:neon-falha 5s linear infinite;
}
@keyframes neon-falha{
  0%,7%,9%,32%,34%,97%,100%{opacity:1;text-shadow:0 0 14px rgba(229,24,55,.5)}
  8%{opacity:.35;text-shadow:none}
  33%{opacity:.5;text-shadow:0 0 4px rgba(229,24,55,.3)}
  33.4%{opacity:1}
  71%{opacity:.85;text-shadow:0 0 22px rgba(229,24,55,.8)}
}
.rotulo-entrada .dica{font-size:11px;letter-spacing:.5em;padding-left:.5em;color:var(--cinza);
  animation:fade-dica 2.6s ease-in-out infinite}
@keyframes fade-dica{0%,100%{opacity:.35}50%{opacity:.9}}

.ecg{position:fixed;bottom:34px;left:50%;transform:translateX(-50%);width:min(360px,70vw);opacity:.5;z-index:10}
.ecg path{stroke:var(--sangue);stroke-width:1.5;fill:none;stroke-dasharray:600;stroke-dashoffset:600;
  animation:ecg-run 2.8s linear infinite}
@keyframes ecg-run{to{stroke-dashoffset:0}}

/* ================================================================
   TRANSIÇÃO — flash, aberração cromática, rachadura e ESTILHAÇO 3D
   ================================================================ */
#transicao{position:fixed;inset:0;z-index:50;pointer-events:none;visibility:hidden}
#transicao.ativa{visibility:visible}
.flash{position:absolute;inset:0;background:var(--sangue);opacity:0}
#transicao.ativa .flash{animation:flash-anim .9s ease-out forwards}
@keyframes flash-anim{
  0%{opacity:0}6%{opacity:.95}12%{opacity:.1}18%{opacity:.7}30%{opacity:0}
  38%{opacity:.4}46%{opacity:0}100%{opacity:0}
}
.aberra{position:absolute;inset:0;opacity:0;mix-blend-mode:screen}
.aberra.vm{background:rgba(255,0,60,.28)}
.aberra.cn{background:rgba(0,220,255,.2)}
#transicao.ativa .aberra.vm{animation:ab-vm .7s steps(4) forwards}
#transicao.ativa .aberra.cn{animation:ab-cn .7s steps(4) forwards}
@keyframes ab-vm{0%{opacity:0}20%{opacity:.9;transform:translateX(-9px)}45%{opacity:.3;transform:translateX(6px)}70%{opacity:.6;transform:translateX(-4px)}100%{opacity:0;transform:none}}
@keyframes ab-cn{0%{opacity:0}20%{opacity:.7;transform:translateX(9px)}45%{opacity:.25;transform:translateX(-6px)}70%{opacity:.5;transform:translateX(4px)}100%{opacity:0;transform:none}}
.rachadura{position:absolute;inset:0;opacity:0}
#transicao.ativa .rachadura{animation:racha 1.6s ease-out forwards}
@keyframes racha{0%,6%{opacity:0}10%{opacity:1}60%{opacity:.85}100%{opacity:0}}
.rachadura path{stroke:rgba(233,230,223,.9);stroke-width:1.5;fill:none;
  stroke-dasharray:230;stroke-dashoffset:230;
  filter:drop-shadow(0 0 9px rgba(229,24,55,.95))}
#transicao.ativa .rachadura path{animation:racha-traca .5s cubic-bezier(.15,.7,.3,1) forwards}
#transicao.ativa .rachadura path:nth-child(2){animation-delay:.13s}
@keyframes racha-traca{to{stroke-dashoffset:0}}

#cacos{position:fixed;inset:0;z-index:55;pointer-events:none;display:none;perspective:800px}
#cacos.mostra{display:block}
.caco{position:absolute;inset:0;background:#04050a;will-change:transform,opacity,filter;
  filter:drop-shadow(0 0 0 rgba(229,24,55,0))}
.caco:nth-child(odd){background:#070810}
.caco:nth-child(3n){background:#05060c}
#cacos.voa .caco{animation:caco-voa 1.25s cubic-bezier(.5,0,.9,.3) forwards;animation-delay:var(--dl)}
@keyframes caco-voa{
  0%{transform:none;opacity:1;filter:brightness(1) drop-shadow(0 0 0 rgba(229,24,55,0))}
  10%{transform:translate3d(calc(var(--tx)*.05),calc(var(--ty)*.05),30px) rotate3d(var(--ax),var(--ay),1,calc(var(--rg)*.1));
      filter:brightness(2.1) drop-shadow(0 0 14px rgba(229,24,55,1))}
  34%{transform:translate3d(calc(var(--tx)*.12),calc(var(--ty)*.12),60px) rotate3d(var(--ax),var(--ay),1,calc(var(--rg)*.22));
      filter:brightness(1.4) drop-shadow(0 0 10px rgba(229,24,55,.7));opacity:1}
  100%{transform:translate3d(var(--tx),calc(var(--ty) + 30vh),var(--tz)) rotate3d(var(--ax),var(--ay),1,var(--rg));
      opacity:0;filter:brightness(.5) blur(3px) drop-shadow(0 0 2px rgba(229,24,55,.2))}
}
/* fagulhas voando do centro no impacto */
.fagulha{position:fixed;top:50%;left:50%;width:4px;height:4px;border-radius:50%;z-index:56;
  background:var(--brasa);box-shadow:0 0 10px var(--sangue);pointer-events:none;
  animation:fagulha-voa var(--fd) cubic-bezier(.2,.6,.5,1) forwards}
@keyframes fagulha-voa{
  0%{transform:translate(0,0) scale(1);opacity:1}
  60%{transform:translate(calc(var(--fx)*.65),calc(var(--fy)*.65 - 4vh)) scale(.7);opacity:1}
  100%{transform:translate(var(--fx),calc(var(--fy) + 14vh)) scale(.15);opacity:0}
}
/* onda de choque saindo do centro no impacto */
.onda{position:absolute;top:50%;left:50%;width:12px;height:12px;margin:-6px;
  border-radius:50%;border:2px solid rgba(229,24,55,.9);opacity:0;
  box-shadow:0 0 30px rgba(229,24,55,.7), inset 0 0 20px rgba(229,24,55,.5)}
#transicao.ativa .onda{animation:onda-expande 1s cubic-bezier(.1,.6,.3,1) forwards}
#transicao.ativa .onda.o2{animation-delay:.14s;border-width:1px}
@keyframes onda-expande{
  0%{opacity:0;transform:scale(1)}
  12%{opacity:1}
  100%{opacity:0;transform:scale(90)}
}

/* tremor de tela no impacto */
body.treme #palco, body.treme #transicao, body.treme #cacos{animation:treme .5s linear 1}
@keyframes treme{
  0%,100%{transform:translate(0)}
  15%{transform:translate(-7px,4px)}30%{transform:translate(6px,-5px)}
  45%{transform:translate(-5px,-3px)}60%{transform:translate(5px,4px)}
  75%{transform:translate(-3px,2px)}90%{transform:translate(2px,-2px)}
}

/* ================================================================
   PALCO / CARD
   ================================================================ */
#palco{
  position:fixed;inset:0;z-index:5;display:none;
  align-items:center;justify-content:center;padding:22px;
  perspective:1400px;overflow-y:auto;
}
#palco.visivel{display:flex}

.card{
  position:relative;width:min(430px,94vw);
  background:linear-gradient(165deg,var(--aco) 0%,var(--carvao) 55%,#080a0f 100%);
  border:1px solid var(--fenda);
  clip-path:polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 26px 100%, 0 calc(100% - 26px));
  transform-style:preserve-3d;
  will-change:transform;
  box-shadow:0 30px 80px rgba(0,0,0,.7), 0 0 45px rgba(229,24,55,.10);
  opacity:0;
}
body.rei .card{background:linear-gradient(165deg,var(--aco) 0%,var(--carvao) 55%,#d8d5cb 100%)}
.card.montado{opacity:1;animation:card-chega .9s cubic-bezier(.2,.9,.25,1)}
@keyframes card-chega{
  0%{transform:scale(1.14);filter:blur(10px) brightness(1.6)}
  55%{filter:blur(0) brightness(1.08)}
  100%{transform:scale(1);filter:none}
}
.card::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:6;
  background:
    linear-gradient(135deg, var(--sangue) 0 2px, transparent 2px) top left/40px 40px no-repeat,
    linear-gradient(-45deg, var(--sangue) 0 2px, transparent 2px) bottom right/40px 40px no-repeat;
  opacity:.9;
}
/* sheen periódico atravessando o card */
.card::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:7;
  background:linear-gradient(105deg, transparent 42%, rgba(233,230,223,.07) 50%, transparent 58%);
  transform:translateX(-130%);
  animation:sheen 8s ease-in-out infinite;
}
@keyframes sheen{0%,55%{transform:translateX(-130%)}75%,100%{transform:translateX(130%)}}
.card.espasmo{animation:espasmo .32s steps(3) 1}
@keyframes espasmo{
  0%{transform:translate(0)}
  25%{transform:translate(-4px,2px) skewX(-1.5deg);filter:hue-rotate(-30deg)}
  50%{transform:translate(5px,-2px) skewX(2deg);filter:hue-rotate(25deg) saturate(2)}
  75%{transform:translate(-3px,1px)}
  100%{transform:translate(0)}
}

.kagune{position:absolute;inset:-170px -150px;z-index:-1;pointer-events:none;overflow:visible;
  opacity:.5;transform-origin:center;
  transition:opacity .7s ease, transform .8s cubic-bezier(.2,.8,.2,1)}
.card:hover .kagune,.card:focus-within .kagune{opacity:1;transform:scale(1.05)}
.kagune .tent{transform-box:fill-box;transform-origin:50% 100%}
.kagune .t1{animation:sway 7s ease-in-out infinite alternate}
.kagune .t2{animation:sway 8.2s -2s ease-in-out infinite alternate-reverse}
.kagune .t3{animation:sway 6.4s -1s ease-in-out infinite alternate}
.kagune .t4{animation:sway 9s -3s ease-in-out infinite alternate-reverse}
.kagune .t5{animation:sway 7.6s -.6s ease-in-out infinite alternate}
.kagune .t6{animation:sway 8.6s -2.6s ease-in-out infinite alternate-reverse}
@keyframes sway{from{transform:rotate(-1.6deg) translateY(0)}to{transform:rotate(1.6deg) translateY(-6px)}}
.kagune path{fill:none;stroke-linecap:round}
.kagune .brilho{stroke:var(--sangue);
  animation:brilho-respira 4.4s ease-in-out infinite alternate}
@keyframes brilho-respira{
  from{stroke-width:18;opacity:.13;filter:blur(7px)}
  to{stroke-width:27;opacity:.22;filter:blur(10px)}
}
.kagune .nucleo{
  stroke:url(#gradKagune);stroke-width:9;
  filter:drop-shadow(0 0 10px rgba(229,24,55,.55));
  stroke-dasharray:980;stroke-dashoffset:980;
  transition:stroke-dashoffset 1.4s cubic-bezier(.2,.8,.2,1);
}
.card.montado .kagune .nucleo{stroke-dashoffset:0}
.card.montado .kagune .t2 .nucleo{transition-delay:.1s}
.card.montado .kagune .t3 .nucleo{transition-delay:.2s}
.card.montado .kagune .t4 .nucleo{transition-delay:.3s}
.card.montado .kagune .t5 .nucleo{transition-delay:.4s}
.card.montado .kagune .t6 .nucleo{transition-delay:.5s}
.card:hover .kagune .nucleo{filter:drop-shadow(0 0 18px rgba(229,24,55,.95))}
/* energia em duas camadas correndo dentro do tentáculo */
.kagune .fluxo{stroke:#ff8b96;stroke-width:2.6;opacity:.85;
  stroke-dasharray:6 44;animation:fluxo-corre 1.6s linear infinite;
  transition:stroke-width .4s ease, opacity .4s ease}
.kagune .fluxo2{stroke:#ffd9dd;stroke-width:4;opacity:.28;
  stroke-dasharray:2 76;animation:fluxo-corre 2.8s linear infinite reverse}
.card:hover .kagune .fluxo{stroke-width:3.6;opacity:1}
.kagune .t2 .fluxo{animation-duration:1.9s}.kagune .t3 .fluxo{animation-duration:1.4s}
.kagune .t4 .fluxo{animation-duration:2.1s}.kagune .t5 .fluxo{animation-duration:1.5s}
.kagune .t6 .fluxo{animation-duration:1.8s}
.kagune .t2 .fluxo2{animation-duration:3.3s}.kagune .t4 .fluxo2{animation-duration:2.5s}
.kagune .t6 .fluxo2{animation-duration:3.6s}
@keyframes fluxo-corre{to{stroke-dashoffset:-50}}
.kagune .espinho{stroke:var(--sangue);stroke-width:5;opacity:.9;
  filter:drop-shadow(0 0 6px rgba(229,24,55,.6))}

/* ---------- banner ---------- */
.banner{
  position:relative;height:158px;overflow:hidden;background:#0e1016;
  clip-path:polygon(0 0, calc(100% - 26px) 0, 100% 26px, 100% 100%, 0 100%);
}
.banner img{width:100%;height:100%;object-fit:cover;display:block;
  filter:saturate(.8) contrast(1.08) brightness(.82);
  transform:scale(1.05);transition:transform 6s ease, filter .6s ease}
.card:hover .banner img{transform:scale(1.12);filter:saturate(1) contrast(1.1) brightness(.9)}
.banner::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg, rgba(5,6,8,.1) 40%, var(--carvao) 98%)}
.banner .sem-banner{position:absolute;inset:0;
  background:
   radial-gradient(circle at 80% 20%, rgba(229,24,55,.22), transparent 55%),
   linear-gradient(150deg,#141826,#0a0c12)}
.banner .sem-banner::before{content:"喰";position:absolute;right:14px;top:-8px;
  font-family:var(--jp);font-size:120px;color:transparent;-webkit-text-stroke:1px rgba(229,24,55,.25)}

/* ---------- avatar ---------- */
.zona-avatar{position:relative;height:0}
.avatar-wrap{
  position:absolute;left:26px;top:-58px;width:116px;height:116px;z-index:5;cursor:pointer;
}
.avatar-anel{
  position:absolute;inset:-5px;border-radius:50%;
  background:conic-gradient(from 0deg, var(--sangue), #3a0510 30%, var(--sangue) 52%, #16090c 78%, var(--sangue));
  animation:gira 7s linear infinite;
  filter:drop-shadow(0 0 12px rgba(229,24,55,.5));
}
.avatar-furo{position:absolute;inset:-1px;border-radius:50%;background:var(--carvao)}
.avatar{position:absolute;inset:4px;border-radius:50%;overflow:hidden;background:#000}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .4s ease}
.avatar img.falha{animation:img-falha .35s steps(4) 1}
@keyframes img-falha{
  25%{clip-path:inset(8% 0 62% 0);transform:translateX(-7px);filter:hue-rotate(-40deg)}
  50%{clip-path:inset(58% 0 12% 0);transform:translateX(7px);filter:saturate(3)}
  75%{clip-path:inset(30% 0 40% 0);transform:translateX(-4px)}
}
.avatar-wrap:hover .avatar img{filter:contrast(1.15) saturate(1.2)}
.avatar-wrap:active{transform:scale(.95)}
.moldura{position:absolute;inset:-14px;pointer-events:none;z-index:6}
.moldura img{width:100%;height:100%;object-fit:contain}
.status-dot{
  position:absolute;right:2px;bottom:2px;width:28px;height:28px;border-radius:50%;
  background:var(--off);border:6px solid var(--carvao);z-index:7;
  box-shadow:0 0 14px currentColor;
  animation:pulso-status 2.4s ease-in-out infinite;
}
@keyframes pulso-status{0%,100%{box-shadow:0 0 8px currentColor}50%{box-shadow:0 0 22px currentColor}}
.status-dot.online{background:var(--online);color:var(--online)}
.status-dot.idle{background:var(--idle);color:var(--idle)}
.status-dot.dnd{background:var(--dnd);color:var(--dnd)}
.status-dot.offline{background:var(--off);color:transparent}

.balao{
  position:absolute;left:150px;top:-48px;max-width:calc(100% - 176px);
  background:#191d28;border:1px solid var(--fenda);
  padding:9px 13px;font-size:12.5px;color:#e9e6df;line-height:1.45;
  border-radius:10px;z-index:5;
  opacity:0;transform:translateY(8px);transition:.5s ease;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  animation:flutua 4s ease-in-out infinite;
}
@keyframes flutua{0%,100%{margin-top:0}50%{margin-top:-5px}}
.balao::after{content:"";position:absolute;left:16px;bottom:-8px;width:14px;height:14px;
  background:#191d28;border-right:1px solid var(--fenda);border-bottom:1px solid var(--fenda);
  transform:rotate(45deg) skew(12deg,12deg)}
.balao.visivel{opacity:1;transform:translateY(0)}
.balao .emoji{width:17px;height:17px;vertical-align:-3px;margin-right:5px}

/* ---------- corpo ---------- */
.corpo{padding:70px 26px 24px}
.nome-linha{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.nome{
  font-family:var(--glitch);font-size:clamp(26px,6vw,34px);letter-spacing:.04em;
  position:relative;color:var(--osso);min-height:1em;
}
.nome::before,.nome::after{
  content:attr(data-texto);position:absolute;inset:0;opacity:0;pointer-events:none;
}
.card:hover .nome::before{opacity:.85;color:var(--sangue);
  clip-path:inset(12% 0 58% 0);animation:fatia1 .9s steps(2) infinite}
.card:hover .nome::after{opacity:.85;color:#3ee0ff;mix-blend-mode:screen;
  clip-path:inset(62% 0 8% 0);animation:fatia2 1.1s steps(2) infinite}
@keyframes fatia1{0%{transform:translate(-3px,-1px)}50%{transform:translate(3px,1px)}100%{transform:translate(-2px,0)}}
@keyframes fatia2{0%{transform:translate(3px,1px)}50%{transform:translate(-3px,-2px)}100%{transform:translate(2px,1px)}}
.arroba{font-size:13px;color:var(--cinza);letter-spacing:.14em;cursor:pointer;transition:color .25s}
.arroba:hover{color:var(--brasa)}

.badges{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.badges img{width:24px;height:24px;filter:drop-shadow(0 0 6px rgba(0,0,0,.6));
  transition:.25s ease;cursor:help}
.badges img:hover{transform:translateY(-3px) scale(1.15);filter:drop-shadow(0 0 10px rgba(229,24,55,.7))}

.bio{
  margin-top:16px;font-size:13.5px;line-height:1.75;color:#c9c7c0;
  white-space:pre-wrap;word-break:break-word;
  border-left:2px solid var(--sangue);padding-left:14px;min-height:1em;
}
body.rei .bio{color:#3a3d46}
.bio .caret,.term .caret{display:inline-block;width:8px;height:14px;background:var(--sangue);
  vertical-align:-2px;margin-left:2px;animation:caret-pisca .8s steps(1) infinite}
@keyframes caret-pisca{50%{opacity:0}}

.divisor{
  display:flex;align-items:center;gap:12px;margin:22px 0 14px;
  font-size:10.5px;letter-spacing:.5em;color:var(--cinza);text-transform:uppercase;
}
.divisor::before{content:"";width:18px;height:1px;background:var(--sangue)}
.divisor::after{content:"";flex:1;height:1px;background:var(--fenda)}
.divisor .jp{font-family:var(--jp);color:var(--sangue);letter-spacing:.3em;font-size:11px;text-transform:none}

/* ---------- atividades ---------- */
.atividades{display:flex;flex-direction:column;gap:12px}
.atv{
  position:relative;display:flex;gap:14px;align-items:center;
  background:rgba(255,255,255,.025);border:1px solid var(--fenda);
  padding:12px 14px;
  clip-path:polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  transition:.3s ease;overflow:hidden;
}
body.rei .atv{background:rgba(0,0,0,.03)}
.atv::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--sangue);
  transform:scaleY(0);transform-origin:top;transition:.35s ease}
.atv:hover{background:rgba(229,24,55,.05);border-color:rgba(229,24,55,.35);transform:translateX(4px)}
.atv:hover::before{transform:scaleY(1)}
.atv-img{position:relative;width:56px;height:56px;flex:none}
.atv-img .grande{width:56px;height:56px;object-fit:cover;border-radius:8px;display:block;background:#000}
.atv-img .peq{position:absolute;right:-6px;bottom:-6px;width:24px;height:24px;border-radius:50%;
  border:3px solid var(--carvao);background:#000}
.atv-txt{min-width:0;flex:1}
.atv-tipo{font-size:9.5px;letter-spacing:.35em;color:var(--sangue);text-transform:uppercase;margin-bottom:3px}
.atv-nome{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atv-det{font-size:12px;color:var(--cinza);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.atv-tempo{font-size:11px;color:#6d7180;margin-top:3px;font-variant-numeric:tabular-nums}
.sem-atv{font-size:12.5px;color:#5d6170;letter-spacing:.15em;padding:6px 2px}

.spotify .atv-tipo{color:#1db954}
.spotify:hover{border-color:rgba(29,185,84,.4);background:rgba(29,185,84,.05)}
.spotify::before{background:#1db954}
.barra{margin-top:7px;height:3px;background:var(--fenda);position:relative;overflow:hidden}
.barra i{position:absolute;left:0;top:0;bottom:0;background:#1db954;width:0%;transition:width 1s linear}
.disco{animation:gira 8s linear infinite;border-radius:50%!important}
.viz{position:absolute;right:12px;top:12px;display:flex;gap:2px;align-items:flex-end;height:16px}
.viz i{width:3px;background:#1db954;opacity:.85;animation:viz-sobe .9s ease-in-out infinite}
.viz i:nth-child(1){animation-delay:0s}.viz i:nth-child(2){animation-delay:.18s}
.viz i:nth-child(3){animation-delay:.36s}.viz i:nth-child(4){animation-delay:.1s}
@keyframes viz-sobe{0%,100%{height:20%}50%{height:100%}}

/* ---------- conexões ---------- */
.conexoes{display:flex;flex-wrap:wrap;gap:8px}
.conx{
  display:inline-flex;align-items:center;gap:7px;
  font-size:11px;letter-spacing:.08em;color:#c9c7c0;text-decoration:none;
  background:rgba(255,255,255,.03);border:1px solid var(--fenda);
  padding:6px 11px;
  clip-path:polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  transition:.25s ease;
}
body.rei .conx{color:#3a3d46;background:rgba(0,0,0,.04)}
.conx b{color:var(--osso);font-weight:600}
.conx::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--sangue);
  box-shadow:0 0 8px var(--sangue)}
.conx:hover{border-color:rgba(229,24,55,.45);transform:translateY(-2px);background:rgba(229,24,55,.06)}
.conx.morta{cursor:default}

/* ---------- rodapé ---------- */
.rodape{
  display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;
  margin-top:16px;padding-top:14px;border-top:1px solid var(--fenda);
  font-size:10.5px;letter-spacing:.22em;color:#6d7180;text-transform:uppercase;
}
.rodape b{color:var(--osso);font-weight:600}
.rodape .relogio{font-variant-numeric:tabular-nums;color:var(--cinza)}
.rodape .jp{font-family:var(--jp);color:rgba(229,24,55,.6);letter-spacing:.2em;text-transform:none}

/* ---------- carregando ---------- */
.term{padding:60px 30px;font-size:12.5px;line-height:2.1;color:#9aa0af;letter-spacing:.06em;min-height:220px}
.term .ok{color:var(--online)}.term .warn{color:var(--sangue)}

/* ---------- aviso ---------- */
.aviso{padding:34px 26px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.aviso .jp{font-family:var(--jp);font-size:34px;color:var(--sangue)}
.aviso p{font-size:13px;line-height:1.7;color:#b9b7b0;max-width:34ch}
.aviso a{color:var(--brasa);text-decoration:none;border-bottom:1px solid rgba(229,24,55,.4)}
.aviso code{background:var(--fenda);padding:2px 8px;font-size:12px;border-radius:4px}

.revela{opacity:0;transform:translateY(16px)}
.card.montado .revela{animation:sobe .7s cubic-bezier(.2,.8,.2,1) forwards}
.card.montado .r1{animation-delay:.05s}.card.montado .r2{animation-delay:.16s}
.card.montado .r3{animation-delay:.27s}.card.montado .r4{animation-delay:.38s}
.card.montado .r5{animation-delay:.49s}.card.montado .r6{animation-delay:.60s}
.card.montado .r7{animation-delay:.71s}
@keyframes sobe{to{opacity:1;transform:none}}

/* ================================================================
   MODO KAKUGAN
   ================================================================ */
#kakugan-tela{
  position:fixed;inset:0;z-index:70;pointer-events:none;opacity:0;visibility:hidden;
  background:radial-gradient(ellipse at 50% 50%, transparent 25%, rgba(90,2,14,.55) 100%);
  transition:opacity .4s ease, visibility .4s;
}
#kakugan-tela .kanji-central{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) scale(.6);
  font-family:var(--jp);font-size:min(40vh,40vw);font-weight:800;
  color:transparent;-webkit-text-stroke:2px rgba(229,24,55,.9);
  filter:drop-shadow(0 0 40px rgba(229,24,55,.8));
  transition:transform .6s cubic-bezier(.2,.8,.2,1);
}
body.kakugan #kakugan-tela, body.kakugan-fixo #kakugan-tela{opacity:1;visibility:visible}
body.kakugan #kakugan-tela .kanji-central, body.kakugan-fixo #kakugan-tela .kanji-central{
  transform:translate(-50%,-50%) scale(1);animation:kanji-vibra .12s steps(2) infinite}
@keyframes kanji-vibra{0%{margin-left:0}50%{margin-left:3px}100%{margin-left:-3px}}
body.kakugan .veias, body.kakugan-fixo .veias{opacity:.35}
body.kakugan .vinheta, body.kakugan-fixo .vinheta{
  background:radial-gradient(ellipse at 50% 45%, transparent 25%, rgba(40,0,6,.9) 100%)}
body.kakugan .card, body.kakugan-fixo .card{
  animation:espasmo .3s steps(3) infinite}
body.kakugan .avatar-anel, body.kakugan-fixo .avatar-anel{
  animation:gira 1.2s linear infinite;filter:drop-shadow(0 0 26px rgba(229,24,55,.95))}
body.kakugan .kanji-fantasma, body.kakugan-fixo .kanji-fantasma{
  -webkit-text-stroke-color:rgba(229,24,55,.35)}

/* ================================================================
   CAMADA FINAL DE BELEZA
   ================================================================ */
/* aurora de sangue girando atrás do card */
.aurora{
  position:absolute;width:130vmin;height:130vmin;top:50%;left:50%;
  margin:-65vmin 0 0 -65vmin;pointer-events:none;z-index:0;
  background:conic-gradient(from 0deg,
    transparent 0deg, rgba(229,24,55,.06) 40deg, transparent 90deg,
    transparent 150deg, rgba(229,24,55,.045) 200deg, transparent 250deg,
    transparent 300deg, rgba(255,77,94,.05) 330deg, transparent 360deg);
  filter:blur(38px);
  animation:aurora-gira 34s linear infinite;
}
@keyframes aurora-gira{to{transform:rotate(360deg)}}

/* reflexo do card no "chão" */
.card{-webkit-box-reflect:below 22px linear-gradient(transparent 76%, rgba(0,0,0,.3))}

/* borda de energia percorrendo o contorno do card */
.contorno{position:absolute;inset:0;z-index:8;pointer-events:none;overflow:visible}
.contorno path{
  fill:none;stroke:var(--sangue);stroke-width:1.6;vector-effect:non-scaling-stroke;
  stroke-dasharray:10 90;opacity:.85;
  filter:drop-shadow(0 0 5px rgba(229,24,55,.9));
  animation:contorno-corre 4.5s linear infinite;
}
.contorno path.eco2{stroke-dasharray:4 96;stroke:#ff8b96;animation-duration:6.5s;animation-direction:reverse;opacity:.5}
@keyframes contorno-corre{to{stroke-dashoffset:-100}}

/* pingos de sangue escorrendo do topo do card */
.pingo{position:absolute;top:0;width:2px;z-index:8;pointer-events:none;
  background:linear-gradient(180deg,rgba(229,24,55,.0),var(--sangue));
  animation:pingo-escorre var(--pd,3s) ease-in forwards}
.pingo::after{content:"";position:absolute;bottom:-4px;left:-2px;width:6px;height:6px;
  border-radius:50% 50% 60% 60%;background:var(--sangue);
  box-shadow:0 0 6px rgba(229,24,55,.8)}
@keyframes pingo-escorre{
  0%{height:0;opacity:0}
  15%{opacity:.9}
  70%{height:var(--ph,60px);opacity:.9}
  100%{height:var(--ph,60px);opacity:0}
}

/* radar pingando no status */
.status-dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;
  border:2px solid currentColor;opacity:0;
  animation:radar 3s ease-out infinite}
.status-dot.offline::after{display:none}
@keyframes radar{0%{transform:scale(.5);opacity:.8}70%{transform:scale(1.9);opacity:0}100%{opacity:0}}

/* avatar revelado por íris abrindo (só na primeira vez) */
.card.primeira-vez .avatar img{animation:iris-abre 1s .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes iris-abre{from{clip-path:circle(0% at 50% 50%);filter:brightness(3)}to{clip-path:circle(75% at 50% 50%);filter:brightness(1)}}

/* balão nasce com pop elástico */
.balao.visivel{animation:flutua 4s ease-in-out infinite, balao-pop .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes balao-pop{from{scale:.6;opacity:0}to{scale:1;opacity:1}}

/* cor própria por plataforma nas conexões */
.conx::before{background:var(--pc,var(--sangue));box-shadow:0 0 8px var(--pc,var(--sangue))}

/* relâmpago do modo kakugan */
#relampago{position:fixed;inset:0;z-index:72;pointer-events:none;opacity:0;
  background:linear-gradient(180deg,rgba(255,235,238,.85),rgba(229,24,55,.35) 60%,transparent)}
#relampago.claro{animation:relampago-anim .5s ease-out 1}
@keyframes relampago-anim{
  0%{opacity:0}8%{opacity:1}16%{opacity:.15}26%{opacity:.75}45%{opacity:.05}60%{opacity:.3}100%{opacity:0}
}

/* eco quando você fica parado tempo demais */
.eco{position:fixed;z-index:9;font-family:var(--jp);color:rgba(229,24,55,.0);
  font-size:clamp(16px,3vw,24px);letter-spacing:.4em;pointer-events:none;
  animation:eco-surge 5s ease-in-out forwards}
@keyframes eco-surge{
  0%{color:rgba(229,24,55,0);filter:blur(6px);transform:translateY(10px)}
  30%,70%{color:rgba(229,24,55,.5);filter:blur(0);transform:translateY(0)}
  100%{color:rgba(229,24,55,0);filter:blur(8px);transform:translateY(-14px)}
}

/* vinheta respirando de leve o tempo todo */
.vinheta{animation:vinheta-respira 9s ease-in-out infinite}
@keyframes vinheta-respira{0%,100%{opacity:1}50%{opacity:.82}}

@media (max-width:460px){
  .balao{left:24px;top:auto;bottom:-16px;max-width:calc(100% - 48px)}
  .corpo{padding-top:78px}
  .segredos{left:16px;bottom:44px}
}
</style>
</head>

/* ================================================================
   SOM — sintetizado (batimento em loop, drone grave, impactos)
   ================================================================ */
const Som=(()=>{
  let ctx=null, ligado=true, drone=null, batIntervalo=null;
  const btn=$("#btnSom");
  function garante(){ if(!ctx) ctx=new (window.AudioContext||window.webkitAudioContext)(); if(ctx.state==="suspended") ctx.resume(); }
  function osc(freq,dur,tipo,vol,queda){
    if(!ligado||!ctx) return;
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=tipo; o.frequency.setValueAtTime(freq,ctx.currentTime);
    if(queda) o.frequency.exponentialRampToValueAtTime(queda,ctx.currentTime+dur);
    g.gain.setValueAtTime(vol,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001,ctx.currentTime+dur);
    o.connect(g).connect(ctx.destination);
    o.start(); o.stop(ctx.currentTime+dur);
  }
  function ruido(dur,vol,freq=900,tipoF="lowpass"){
    if(!ligado||!ctx) return;
    const n=ctx.sampleRate*dur, buf=ctx.createBuffer(1,n,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
    const s=ctx.createBufferSource(), g=ctx.createGain(), f=ctx.createBiquadFilter();
    f.type=tipoF; f.frequency.value=freq;
    g.gain.value=vol;
    s.buffer=buf; s.connect(f).connect(g).connect(ctx.destination); s.start();
  }
  function droneOn(){
    if(drone||!ctx) return;
    const o1=ctx.createOscillator(), o2=ctx.createOscillator(),
          g=ctx.createGain(), f=ctx.createBiquadFilter(),
          lfo=ctx.createOscillator(), lg=ctx.createGain();
    o1.type="sawtooth"; o1.frequency.value=36;
    o2.type="sine"; o2.frequency.value=54.3;
    f.type="lowpass"; f.frequency.value=190;
    g.gain.value=.028;
    lfo.frequency.value=.08; lg.gain.value=.014;
    lfo.connect(lg).connect(g.gain);
    o1.connect(f); o2.connect(f); f.connect(g).connect(ctx.destination);
    o1.start(); o2.start(); lfo.start();
    drone={o1,o2,lfo,g};
  }
  function droneOff(){ if(!drone) return; try{drone.o1.stop();drone.o2.stop();drone.lfo.stop();}catch(e){} drone=null; }
  const api={
    batimento(){ garante(); osc(52,.22,"sine",.5,30); setTimeout(()=>osc(48,.3,"sine",.6,26),260); },
    impacto(){ garante(); ruido(.6,.5); osc(38,.8,"sine",.7,20); },
    vidro(){
      garante();
      for(let i=0;i<8;i++){
        setTimeout(()=>{
          osc(2200+Math.random()*2800,.04,"square",.055);
          ruido(.06,.14,3800,"highpass");
        }, i*26+Math.random()*22);
      }
      osc(150,.55,"sine",.32,42);
    },
    whoosh(){ garante(); ruido(.5,.3,2400,"highpass"); },
    trovao(){ garante(); ruido(.7,.4,260,"lowpass"); osc(46,.9,"sine",.4,24); },
    pop(){ garante(); osc(430,.09,"sine",.18,950); },
    tick(){ garante(); osc(1600,.03,"square",.04); },
    sussurro(){ garante(); ruido(.25,.08); },
    liga(){ /* arranca o ambiente sonoro no primeiro gesto do usuário */
      if(!ligado) return;
      garante(); droneOn();
      if(!batIntervalo) batIntervalo=setInterval(()=>{api.batimento();pulsoVisual();},2600);
      api.batimento(); pulsoVisual();
    }
  };
  btn.addEventListener("click",()=>{
    ligado=!ligado; garante();
    btn.textContent="som: "+(ligado?"on":"off");
    btn.classList.toggle("ligado",ligado);
    btn.setAttribute("aria-pressed",String(ligado));
    if(ligado){
      droneOn(); api.batimento(); pulsoVisual();
      batIntervalo=setInterval(()=>{api.batimento();pulsoVisual();},2600);
      retomaMusica();
    }else{
      droneOff(); clearInterval(batIntervalo);
      pausaMusica();
    }
  });
  function pulsoVisual(){
    document.body.classList.add("batida");
    setTimeout(()=>document.body.classList.remove("batida"),280);
  }
  return api;
})();

   PARTÍCULAS — células RC + chuva (cores acompanham o Modo Rei)
   ================================================================ */
(function(){
  const cv=$("#celulas"), ctx=cv.getContext("2d");
  let W,H,mx=-9999,my=-9999;
  function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
  resize(); addEventListener("resize",resize);
  addEventListener("mousemove",e=>{mx=e.clientX;my=e.clientY;});
  const cels=[], gotas=[], tempestade=[];
  const N=Math.min(70,Math.floor(innerWidth/16));
  for(let i=0;i<N;i++) cels.push({
    x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    r:Math.random()*2.2+0.6, vy:Math.random()*0.35+0.1, vx:(Math.random()-.5)*0.18,
    fase:Math.random()*Math.PI*2, vermelha:Math.random()<0.42
  });
  for(let i=0;i<24;i++) gotas.push({
    x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    len:Math.random()*14+8, v:Math.random()*5+4
  });
  for(let i=0;i<55;i++) tempestade.push({
    x:Math.random()*innerWidth, y:Math.random()*innerHeight,
    len:Math.random()*22+14, v:Math.random()*9+9
  });
  function tick(){
    const rei=document.body.classList.contains("rei");
    const kak=document.body.classList.contains("kakugan")||document.body.classList.contains("kakugan-fixo");
    ctx.clearRect(0,0,W,H);
    ctx.strokeStyle=kak?"rgba(229,24,55,.28)":"rgba(229,24,55,.10)"; ctx.lineWidth=1;
    for(const g of gotas){
      g.y+=g.v*(kak?1.8:1); g.x+=0.6;
      if(g.y>H){g.y=-g.len; g.x=Math.random()*W;}
      ctx.beginPath(); ctx.moveTo(g.x,g.y); ctx.lineTo(g.x-1.5,g.y-g.len); ctx.stroke();
    }
    if(kak){ /* tempestade */
      ctx.strokeStyle="rgba(255,77,94,.35)"; ctx.lineWidth=1.4;
      for(const g of tempestade){
        g.y+=g.v; g.x+=1.4;
        if(g.y>H){g.y=-g.len; g.x=Math.random()*W;}
        ctx.beginPath(); ctx.moveTo(g.x,g.y); ctx.lineTo(g.x-3,g.y-g.len); ctx.stroke();
      }
    }
    for(const p of cels){
      p.fase+=0.012; p.y+=p.vy; p.x+=p.vx+Math.sin(p.fase)*0.22;
      /* células fogem do cursor */
      const dx=p.x-mx, dy=p.y-my, dist=Math.hypot(dx,dy);
      if(dist<110&&dist>0.1){
        const f=(110-dist)/110*1.6;
        p.x+=dx/dist*f; p.y+=dy/dist*f;
      }
      if(p.y>H+8){p.y=-8;p.x=Math.random()*W;}
      if(p.x<-8)p.x=W+8; if(p.x>W+8)p.x=-8;
      const alfa=0.18+Math.sin(p.fase)*0.12;
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=p.vermelha
        ? `rgba(229,24,55,${alfa+0.1})`
        : (rei?`rgba(21,22,26,${alfa*0.5})`:`rgba(233,230,223,${alfa*0.55})`);
      ctx.shadowColor=p.vermelha?"rgba(229,24,55,.8)":"transparent";
      ctx.shadowBlur=p.vermelha?6:0;
      ctx.fill();
    }
    ctx.shadowBlur=0;
    requestAnimationFrame(tick);
  }
  tick();
})();

(function(){

    {d1:"M330,600 C300,430 180,380 150,250 C136,190 160,140 138,80",
     d2:"M330,600 C288,438 196,368 158,244 C144,184 148,148 126,76",
     dur:5.0, ini:"-3s",  cls:"t5", esp:"M192,302 q-26,-4 -38,-24"},
    {d1:"M365,600 C400,430 515,375 545,245 C558,188 534,138 556,78",
     d2:"M365,600 C412,442 500,362 538,240 C550,182 546,144 568,74",
     dur:5.4, ini:"-1.9s",cls:"t6", esp:"M500,297 q26,-6 38,-26"}
  ];
  function pathMorf(cls,t,comGarra){
    const p=document.createElementNS(NS,"path");
    p.setAttribute("class",cls);
    p.setAttribute("d",t.d1);
    if(comGarra) p.setAttribute("marker-end","url(#garra)");
    const a=document.createElementNS(NS,"animate");
    a.setAttribute("attributeName","d");
    a.setAttribute("values",t.d1+";"+t.d2+";"+t.d1);

    a.setAttribute("dur",t.dur+"s");
    a.setAttribute("begin",t.ini);
    a.setAttribute("repeatCount","indefinite");
    p.appendChild(a);
    return p;
  }
  for(const t of TENTS){
    const g=document.createElementNS(NS,"g");

    g.appendChild(pathMorf("nucleo",t,true));

    }

  }
})();

function gerarCacos(){
  cacos.innerHTML="";
  const cols=6, rows=5;
  for(let i=0;i<cols*rows;i++){
    const col=i%cols, row=(i/cols)|0;
    const w=100/cols, h=100/rows;
    const x0=col*w, y0=row*h;
    const j=()=> (Math.random()*6-3);
    const d=document.createElement("div");
    d.className="caco";
    d.style.clipPath=`polygon(${x0+j()}% ${y0+j()}%, ${x0+w+j()}% ${y0+j()}%, ${x0+w+j()}% ${y0+h+j()}%, ${x0+j()}% ${y0+h+j()}%)`;
    const dirx=(x0+w/2-50), diry=(y0+h/2-50);
    const dist=Math.hypot(dirx,diry); /* distância do centro (0 a ~70) */
    d.style.setProperty("--tx",(dirx*2.6+(Math.random()*24-12)).toFixed(0)+"vw");
    d.style.setProperty("--ty",(diry*2.6+(Math.random()*24-12)).toFixed(0)+"vh");
    /* profundidade: uns voam pra trás, uns voam NA SUA CARA */
    d.style.setProperty("--tz",(Math.random()<.3 ? 380+Math.random()*260 : -80+Math.random()*220).toFixed(0)+"px");
    d.style.setProperty("--rg",((Math.random()*160-80)|0)+"deg");
    d.style.setProperty("--ax",(Math.random()*2-1).toFixed(2));
    d.style.setProperty("--ay",(Math.random()*2-1).toFixed(2));
    /* ondulação: cacos do centro voam primeiro, bordas depois */
    d.style.setProperty("--dl",((dist*4.5+Math.random()*40)|0)+"ms");
    cacos.appendChild(d);
  }
}

function soltaFagulhas(){

/* tilt 3D suave — interpolado por frame, nunca trava */
const tilt={ax:0,ay:0,alvoX:0,alvoY:0,ativo:false};
palco.addEventListener("mousemove",e=>{
  const r=card.getBoundingClientRect();
  tilt.alvoX=(e.clientX-(r.left+r.width/2))/r.width;
  tilt.alvoY=(e.clientY-(r.top+r.height/2))/r.height;
  tilt.ativo=true;
});
palco.addEventListener("mouseleave",()=>{tilt.alvoX=0;tilt.alvoY=0;});
(function loopTilt(){
  requestAnimationFrame(loopTilt);
  if(!tilt.ativo||!palco.classList.contains("visivel")) return;
  /* espasmo/kakugan usam animation de transform — não disputar */
  const kak=document.body.classList.contains("kakugan")||document.body.classList.contains("kakugan-fixo");
  tilt.ax+=(tilt.alvoX-tilt.ax)*0.12;
  tilt.ay+=(tilt.alvoY-tilt.ay)*0.12;
  if(!kak&&!card.classList.contains("espasmo")){
    card.style.transform=`rotateY(${(tilt.ax*7).toFixed(2)}deg) rotateX(${(tilt.ay*-7).toFixed(2)}deg)`;
  }
  const bn=card.querySelector(".banner img");
  if(bn) bn.style.translate=`${(-tilt.ax*12).toFixed(1)}px ${(-tilt.ay*8).toFixed(1)}px`;
  const aw=card.querySelector(".avatar-wrap");
  if(aw) aw.style.translate=`${(tilt.ax*7).toFixed(1)}px ${(tilt.ay*5).toFixed(1)}px`;
  /* chegou no zero depois do mouseleave? dorme */
  if(Math.abs(tilt.ax)<0.001&&Math.abs(tilt.ay)<0.001&&tilt.alvoX===0&&tilt.alvoY===0){
    tilt.ativo=false;
    card.style.transform="";
    if(bn) bn.style.translate=""; if(aw) aw.style.translate="";
  }
})();

const GLIFOS="アカサタナハマヤラワ喰赫#%&@$0123456789";
function scramble(el,final,dur=900){
  const inicio=performance.now();
  (function passo(t){
    const p=Math.min(1,(t-inicio)/dur);
    const fixos=Math.floor(final.length*p);
    let s=final.slice(0,fixos);
    for(let i=fixos;i<final.length;i++) s+=GLIFOS[Math.floor(Math.random()*GLIFOS.length)];
    el.textContent=s;
    if(p<1) requestAnimationFrame(passo);
    else el.textContent=final;
  })(inicio);
}

  const n=encodeURIComponent(c.name), id=encodeURIComponent(c.id);
  switch(c.type){
    case "github": return "https://github.com/"+n;
    case "twitch": return "https://twitch.tv/"+n;
    case "steam": return "https://steamcommunity.com/profiles/"+id;
    case "twitter": return "https://x.com/"+n;
    case "spotify": return "https://open.spotify.com/user/"+id;
    case "instagram": return "https://instagram.com/"+n;
    case "tiktok": return "https://tiktok.com/@"+n;
    case "reddit": return "https://reddit.com/user/"+n;
    case "youtube": return "https://youtube.com/channel/"+id;
    case "domain": return "https://"+c.name;
    default: return null;
  }
}
const TIPO={0:"jogando",1:"transmitindo",2:"ouvindo",3:"assistindo",5:"competindo"};
const STATUS_TXT={online:"online",idle:"ausente",dnd:"não perturbe",offline:"offline"};

function render(d){
  dadosAtuais=d;
  const u=d.discord_user;
  const nome=u.global_name||u.display_name||u.username;
  const banner=perfilExtra&&perfilExtra.banner?urlBanner(perfilExtra.banner):null;
  const bio=(perfilExtra&&perfilExtra.bio)||"";
  const badges=(perfilExtra&&perfilExtra.badges)||[];
  const conexoes=(perfilExtra&&perfilExtra.conexoes)||[];
  const moldura=urlMoldura(u);
  const custom=(d.activities||[]).find(a=>a.type===4);
  const atvs=(d.activities||[]).filter(a=>a.type!==4&&a.name!=="Spotify");
  const sp=d.spotify;

  atualizaAba(d);

  let htmlAtv="";
  if(sp){
    const pct=Math.min(100,((Date.now()-sp.timestamps.start)/(sp.timestamps.end-sp.timestamps.start))*100);
    htmlAtv+=`<div class="atv spotify" data-ini="${sp.timestamps.start}" data-fim="${sp.timestamps.end}">
      <div class="viz"><i></i><i></i><i></i><i></i></div>
      <div class="atv-img"><img class="grande disco" src="${esc(sp.album_art_url)}" alt=""></div>
      <div class="atv-txt">
        <div class="atv-tipo">ouvindo spotify</div>
        <div class="atv-nome">${esc(sp.song)}</div>
        <div class="atv-det">${esc(sp.artist)}</div>
        <div class="barra"><i style="width:${pct}%"></i></div>
        <div class="atv-tempo sp-tempo"></div>
      </div></div>`;
  }
  for(const a of atvs){
    const g=urlAtivo(a,"large_image"), p=urlAtivo(a,"small_image");
    htmlAtv+=`<div class="atv" ${a.timestamps&&a.timestamps.start?`data-ini="${a.timestamps.start}"`:""}>
      <div class="atv-img">
        ${g?`<img class="grande" src="${esc(g)}" alt="">`:`<div class="grande" style="display:grid;place-items:center;font-family:var(--jp);color:var(--sangue);font-size:22px">遊</div>`}
        ${p?`<img class="peq" src="${esc(p)}" alt="">`:""}
      </div>
      <div class="atv-txt">
        <div class="atv-tipo">${TIPO[a.type]||"atividade"}</div>
        <div class="atv-nome">${esc(a.name)}</div>
        ${a.details?`<div class="atv-det">${esc(a.details)}</div>`:""}
        ${a.state?`<div class="atv-det">${esc(a.state)}</div>`:""}
        ${a.timestamps&&a.timestamps.start?`<div class="atv-tempo">${decorreu(a.timestamps.start)} decorridos</div>`:""}
      </div></div>`;
  }
  if(!htmlAtv) htmlAtv=`<div class="sem-atv">— nenhum sinal de atividade no momento —</div>`;

  let htmlConx="";
  if(conexoes.length){
    htmlConx=`<div class="divisor revela r6"><span class="jp">接続</span> conexões</div>
    <div class="conexoes revela r6">`+conexoes.map(c=>{
      const link=linkConexao(c);
      const cor=COR_CONEXAO[c.type]||"";
      const estilo=cor?` style="--pc:${cor}"`:"";
      const chip=`<span>${esc(c.type)}</span> <b>${esc(c.name)}</b>`;
      return link?`<a class="conx"${estilo} href="${esc(link)}" target="_blank" rel="noopener">${chip}</a>`
                 :`<span class="conx morta"${estilo}>${chip}</span>`;
    }).join("")+`</div>`;
  }

  cont.innerHTML=`
    <div class="banner revela r1">
      ${banner?`<img src="${esc(banner)}" alt="">`:`<div class="sem-banner"></div>`}
    </div>
    <div class="zona-avatar">
      <div class="avatar-wrap revela r2" id="avatarWrap" title="…">
        <div class="avatar-anel"></div>
        <div class="avatar-furo"></div>
        <div class="avatar"><img src="${esc(urlAvatar(u))}" alt="avatar de ${esc(nome)}"></div>
        ${moldura?`<div class="moldura"><img src="${esc(moldura)}" alt=""></div>`:""}
        <span class="status-dot ${esc(d.discord_status)}" title="${STATUS_TXT[d.discord_status]||""}"></span>
      </div>
      ${custom?`<div class="balao" id="balao">
        ${custom.emoji&&custom.emoji.id?`<img class="emoji" src="https://cdn.discordapp.com/emojis/${custom.emoji.id}.${custom.emoji.animated?"gif":"png"}" alt="">`
          :custom.emoji?esc(custom.emoji.name)+" ":""}${esc(custom.state||"")}
      </div>`:""}
    </div>
    <div class="corpo">
      <div class="nome-linha revela r3">
        <h1 class="nome" id="nomeEl" data-texto="${esc(nome)}">${esc(nome)}</h1>
        <span class="arroba" id="arrobaEl" title="clique para copiar">@${esc(u.username)}</span>
      </div>
      ${badges.length?`<div class="badges revela r3">`+badges.map(b=>
        `<img src="https://cdn.discordapp.com/badge-icons/${esc(b.icon)}.png" title="${esc(b.description||b.id)}" alt="${esc(b.id)}">`
      ).join("")+`</div>`:""}
      ${bio?`<p class="bio revela r4" id="bioEl">${esc(bio)}</p>`:""}
      <div class="divisor revela r5"><span class="jp">活動</span> atividade · ${STATUS_TXT[d.discord_status]||d.discord_status}</div>
      <div class="atividades revela r5">${htmlAtv}</div>
      ${htmlConx}
      <div class="rodape revela r7">
        <span>desde <b>${membroDesde(u.id)}</b></span>
        <span class="relogio" id="relogio"></span>
        <span class="jp">半人半喰</span>
      </div>
    </div>`;

  const balao=document.getElementById("balao");
  if(balao) setTimeout(()=>{balao.classList.add("visivel");Som.pop();},800);
  const aw=document.getElementById("avatarWrap");
  if(aw) aw.addEventListener("click",cliqueAvatar);
  const ar=document.getElementById("arrobaEl");
  if(ar) ar.addEventListener("click",()=>{
    navigator.clipboard&&navigator.clipboard.writeText(u.username).then(()=>{
      const antes=ar.textContent; ar.textContent="copiado!";
      setTimeout(()=>ar.textContent=antes,1000);
    }).catch(()=>{});
  });

  if(!jaRevelou){
    jaRevelou=true;
    card.classList.add("primeira-vez");
    setTimeout(()=>card.classList.remove("primeira-vez"),2500);
    const nomeEl=document.getElementById("nomeEl");
    setTimeout(()=>scramble(nomeEl,nome,1100),350);
    const bioEl=document.getElementById("bioEl");
    if(bioEl){const txt=bio; setTimeout(()=>datilografa(bioEl,txt),900);}
  }

  clearInterval(timerRelogio);
  timerRelogio=setInterval(()=>{
    document.querySelectorAll(".atv[data-ini]").forEach(el=>{
      const ini=+el.dataset.ini;
      if(el.dataset.fim){
        const fim=+el.dataset.fim;
        const b=el.querySelector(".barra i");
        if(b) b.style.width=Math.min(100,((Date.now()-ini)/(fim-ini))*100)+"%";
        const t=el.querySelector(".sp-tempo");
        if(t) t.textContent=fmtMs(Math.min(Date.now(),fim)-ini)+" / "+fmtMs(fim-ini);
      }else{
        const t=el.querySelector(".atv-tempo");
        if(t) t.textContent=decorreu(ini)+" decorridos";
      }
    });
    const rel=document.getElementById("relogio");
    if(rel) rel.textContent=new Date().toLocaleTimeString("pt-BR");
  },1000);
}

function renderAviso(msg){
  cont.innerHTML=`<div class="aviso">
    <span class="jp">未登録</span>
    <p>${msg}</p>
    <p>Entre no servidor <a href="https://discord.gg/lanyard" target="_blank" rel="noopener">discord.gg/lanyard</a> com a conta <code>${USER_ID}</code> e recarregue a página.</p>
  </div>`;
}

async function buscaPerfilExtra(){
  try{
    const r=await fetch(`https://dcdn.dstn.to/profile/${USER_ID}`);
    if(!r.ok) return;
    const j=await r.json();
    perfilExtra={
      bio:(j.user_profile&&j.user_profile.bio)||(j.user&&j.user.bio)||"",
      banner:(j.user&&j.user.banner)||null,
      badges:Array.isArray(j.badges)?j.badges:[],
      conexoes:Array.isArray(j.connected_accounts)?j.connected_accounts:[]
    };
    if(dadosAtuais) render(dadosAtuais);
  }catch(e){}
}

async function iniciaDados(){
  buscaPerfilExtra();
  try{
    const r=await fetch(`https://api.lanyard.rest/v1/users/${USER_ID}`);
    const j=await r.json();
    if(j.success) render(j.data);
    else renderAviso("Esse ID ainda não está monitorado pelo Lanyard.");
  }catch(e){
    renderAviso("Não consegui alcançar a API do Lanyard. Se estiver no preview do chat, abra o arquivo direto no navegador ou publique o site.");
  }
  conectaWS();
}
function conectaWS(){
  let ws, hb;
  function abre(){
    try{ws=new WebSocket("wss://api.lanyard.rest/socket");}catch(e){return;}
    ws.onmessage=ev=>{
      const m=JSON.parse(ev.data);
      if(m.op===1){
        hb=setInterval(()=>ws.readyState===1&&ws.send(JSON.stringify({op:3})),m.d.heartbeat_interval);
        ws.send(JSON.stringify({op:2,d:{subscribe_to_id:USER_ID}}));
      }else if(m.op===0&&m.d){
        const d=m.t==="INIT_STATE"?(m.d[USER_ID]||m.d):m.d;
        if(d&&d.discord_user) render(d);
      }
    };
    ws.onclose=()=>{clearInterval(hb);setTimeout(abre,5000);};
  }
  abre();
}
iniciaDados();
</script>
